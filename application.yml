spring:
  application:
    name: fluxupi

  datasource:
    url: jdbc:postgresql://localhost:5432/fluxupi
    username: fluxupi
    password: fluxupi_local_dev

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never auto-generated
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.fluxupi: DEBUG
    org.hibernate.SQL: WARN
