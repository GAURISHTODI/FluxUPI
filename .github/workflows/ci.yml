name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # The Docker daemon on GitHub's Ubuntu runners is what Testcontainers uses
    # to spin up the real Postgres the integration tests need. No services
    # block is required — Testcontainers manages the container lifecycle.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, unit tests, and Testcontainers integration tests
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-and-failsafe-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image
        run: docker build -t fluxupi:ci .
