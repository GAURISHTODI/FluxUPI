services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxupi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxupi
      POSTGRES_USER: fluxupi
      POSTGRES_PASSWORD: fluxupi_local_dev
    ports:
      - "5432:5432"
    volumes:
      - fluxupi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxupi -d fluxupi"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fluxupi-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fluxupi
      SPRING_DATASOURCE_USERNAME: fluxupi
      SPRING_DATASOURCE_PASSWORD: fluxupi_local_dev
    ports:
      - "8080:8080"

volumes:
  fluxupi_pgdata:
